frontend:
  replicaCount: 1
  image:
    repository: 949193188574.dkr.ecr.us-east-1.amazonaws.com/ecommerce-frontend
    pullPolicy: IfNotPresent
    tag: "19"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http
  resources: {}

backend:
  replicaCount: 1
  image:
    repository: 949193188574.dkr.ecr.us-east-1.amazonaws.com/ecommerce-backend
    pullPolicy: IfNotPresent
    tag: "19"
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  livenessProbe:
    httpGet:
      path: /health
      port: http
  readinessProbe:
    httpGet:
      path: /health
      port: http
  resources: {}
  env: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /health
          pathType: ImplementationSpecific
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
