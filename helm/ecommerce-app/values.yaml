replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: "29"

imagePullSecrets:
  - name: ecr-registry-secret

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

frontend:
  replicaCount: 1
  image:
    repository: 949193188574.dkr.ecr.us-east-1.amazonaws.com/ecommerce-frontend
    tag: "30"
    pullPolicy: Always
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
  resources: {}

backend:
  replicaCount: 1
  image:
    repository: 949193188574.dkr.ecr.us-east-1.amazonaws.com/ecommerce-backend
    tag: "30"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  resources: {}
  env:
    - name: DB_HOST
      value: "ecommerce-app-postgres"
    - name: DB_USER
      value: "postgres"
    - name: DB_PASSWORD
      value: "postgres"
    - name: DB_NAME
      value: "ecommerce"
    - name: DB_PORT
      value: "5432"

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
  env:
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_PASSWORD
      value: "postgres"
    - name: POSTGRES_DB
      value: "ecommerce"
  resources: {}
